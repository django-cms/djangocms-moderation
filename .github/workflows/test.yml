name: CodeCov

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      ENABLE_VERSIONING: 1
      CMS_TREE_BACKEND: ${{ matrix.tree-backend }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]  # latest release minus two
        requirements-file: [
            dj52_cms51.txt,
            dj52_cms50.txt,
            dj52_cms41.txt,
        ]
        os: [
            ubuntu-latest,
        ]
        tree-backend: [ treebeard ]
        include:
          # The dependency free tree backend django CMS 5.0.10/5.1.1 introduced
          - python-version: "3.12"
            requirements-file: dj52_cms51.txt
            os: ubuntu-latest
            tree-backend: mptree
          # ... and the same with django-treebeard uninstalled, which is the
          # point of the backend: the moderation tree must not pull it back in.
          - python-version: "3.12"
            requirements-file: dj52_cms51.txt
            os: ubuntu-latest
            tree-backend: mptree
            without-treebeard: true
        exclude:
          - requirements-file: "dj42_cms40.txt"
            python-version: "3.12" #cms40 not support py3.12 yet
          - requirements-file: "dj32_cms40.txt"
            python-version: "3.12"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}

      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/requirements/${{ matrix.requirements-file }}
        python -m pip install -e .

    - name: Uninstall django-treebeard
      if: matrix.without-treebeard
      run: python -m pip uninstall -y django-treebeard

    # ``test_for_missing_migrations`` builds the whole migration graph, and
    # django CMS' own historical ``cms.migrations.0005_auto_20140924_1039``
    # imports ``treebeard.numconv`` at module level -- so that one test cannot
    # run without treebeard installed, for reasons outside this package. Every
    # other job still runs it.
    - name: Run coverage
      run: coverage run -m pytest ${{ matrix.without-treebeard && '--deselect tests/test_a_migrations.py::MigrationTestCase::test_for_missing_migrations' || '' }}

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v7
